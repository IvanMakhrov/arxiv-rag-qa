apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: rag-project
  labels:
    app: rag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
        - name: rag-service
          image: rag-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://airflow:airflow@postgresql-ha:5432/airflow"
            - name: AWS_ENDPOINT_URL
              value: "http://minio-service:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "db+postgresql://airflow:airflow@postgresql-ha:5432/airflow"
            - name: PYTHONPATH
              value: "/app/src"
          volumeMounts:
            - name: project-data
              mountPath: /app/data
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: project-data
          persistentVolumeClaim:
            claimName: rag-data-pvc
      imagePullSecrets:
        - name: docker-registry-secret
