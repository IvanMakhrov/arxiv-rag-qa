apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: rag-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
        - name: webserver
          image: apache/airflow:2.10.1
          command: ["airflow", "webserver"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: app-secrets
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@postgresql-ha:5432/airflow"
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AIRFLOW__CORE__FERNET_KEY
            - name: AIRFLOW__CORE__EXECUTOR
              value: "LocalExecutor"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
            - name: _PIP_ADDITIONAL_REQUIREMENTS
              value: "-e /opt/airflow/project[airflow]"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_ENDPOINT_URL
              value: "http://minio-service:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: PYTHONPATH
              value: "/opt/airflow/src"
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: src
              mountPath: /opt/airflow/src
          resources:
            requests:
              memory: "4Gi"
              cpu: "1000m"
            limits:
              memory: "6Gi"
              cpu: "1500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: dags
          configMap:
            name: airflow-dags-config
        - name: src
          configMap:
            name: project-src-config
      imagePullSecrets:
        - name: docker-registry-secret
