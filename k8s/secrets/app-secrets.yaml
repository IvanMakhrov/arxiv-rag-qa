apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: rag-project
type: Opaque
stringData:
  # Keys here are expected to come from your .env file.
  # Recommended: do NOT commit real values, only keep this structure,
  # and create the Secret in the cluster with:
  #   kubectl create secret generic app-secrets --from-env-file=.env -n rag-project
  #
  # Example keys (align with your .env):
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  GF_SECURITY_ADMIN_USER: ""
  GF_SECURITY_ADMIN_PASSWORD: ""
  AIRFLOW__CORE__FERNET_KEY: ""
  DATABASE_URL: ""
