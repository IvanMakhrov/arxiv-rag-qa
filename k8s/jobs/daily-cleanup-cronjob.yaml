apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-cleanup
  namespace: rag-project
  labels:
    app: rag-project
    component: cronjob
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: rag-project
            component: cronjob
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: apache/airflow:2.10.1
              command: ["/bin/bash", "-c"]
              args:
                - |
                  echo "Starting daily cleanup tasks..."
                  python /opt/airflow/src/tasks/daily_cleanup.py
                  echo "Daily tasks completed!"
              envFrom:
                - configMapRef:
                    name: app-config
                - secretRef:
                    name: app-secrets
              env:
                - name: DATABASE_URL
                  value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql-ha:5432/$(POSTGRES_DB)"
                - name: PYTHONPATH
                  value: "/opt/airflow/src"
              volumeMounts:
                - name: project-src
                  mountPath: /opt/airflow/src
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "100m"
          volumes:
            - name: project-src
              configMap:
                name: project-src-config
