apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: rag-project
  labels:
    app: rag-project
    component: migration
spec:
  template:
    metadata:
      labels:
        app: rag-project
        component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: apache/airflow:2.10.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Starting database migrations..."
              pip install -e /opt/airflow/project[airflow]
              airflow db upgrade
              airflow users create \
                --username ${_AIRFLOW_WWW_USER_USERNAME} \
                --password ${_AIRFLOW_WWW_USER_PASSWORD} \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@example.com
              echo "Migrations completed!"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql-ha:5432/$(POSTGRES_DB)"
            - name: PYTHONPATH
              value: "/opt/airflow/src"
          volumeMounts:
            - name: project-code
              mountPath: /opt/airflow/project
            - name: project-src
              mountPath: /opt/airflow/src
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: project-code
          configMap:
            name: project-code-config
        - name: project-src
          configMap:
            name: project-src-config
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
