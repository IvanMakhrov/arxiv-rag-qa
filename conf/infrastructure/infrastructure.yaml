dag:
  http_conn_id: rag_service
  response_check: 200
  retries: 1
  retry_delay: 1
  download_timeout: 36000
  parse_timeout: 36000
  chunking_timeout: 36000
  embeddings_timeout: 86400
  test_data_timeout: 36000
  qdrant_timeout: 36000
  retriever_eval_timeout: 86400
  generator_eval_timeout: 86400

minio:
  bucket_name: rag-data

redis:
  host: localhost
  port: 6379
  db: 0
  enable_cache: true
  cache_config:
    base_ttl: 3600
    max_ttl: 86400
    min_ttl: 600
    frequency_decay: 0.95
    key_prefix: "rag:embedding:"
    frequency_prefix: "rag:frequency:"
