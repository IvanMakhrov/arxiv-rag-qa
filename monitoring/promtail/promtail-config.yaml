# monitoring/promtail/promtail-config.yaml
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-json
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

      # Compose service label (primary)
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
        action: replace
        regex: (.+)

      # Fallback: extract from container name (more flexible regex)
      - source_labels: [container]
        regex: ".*?(rag-service|celery-worker).*"
        target_label: service
        action: replace

      # Add project name
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

      # Log stream
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

      # Drop containers without service label after all attempts
      - source_labels: [service]
        regex: "^$"
        action: drop
